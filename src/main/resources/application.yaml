spring:
  application:
    name: taskflow-backend
  # Los valores por defecto apuntan al docker compose de desarrollo; en otros entornos llegan por variables
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
